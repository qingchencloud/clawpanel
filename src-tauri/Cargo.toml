[package]
name = "clawpanel"
default-run = "clawpanel"
version = "0.22.5"
edition = "2021"
description = "ClawPanel - OpenClaw 可视化管理面板"
authors = ["qingchencloud"]
repository = "https://github.com/qingchencloud/clawpanel"
homepage = "https://github.com/qingchencloud/clawpanel"
license = "AGPL-3.0"

[lib]
name = "clawpanel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream", "gzip", "brotli", "deflate"], default-features = false }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
regex = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
keyring = { version = "3.6", default-features = false }
open = "5"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "sync", "net", "io-util", "io-std", "macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
# 与reqwest复用实际Rustls；最低0.23.45防止已知TLS加密层边界漏洞复发。
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
