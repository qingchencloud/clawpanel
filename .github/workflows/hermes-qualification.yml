            env=isolationEnv({home,temp:path.join(output,'tmp'),realProfile:proof.actualProfile});
            for(const k of ['CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN','ProgramFiles','ProgramFiles(x86)','ProgramW6432'])if(process.env[k])env[k]=process.env[k];env.PATH=process.env.NATIVE_TOOL_BIN+';'+path.dirname(process.execPath)+';'+env.PATH;
            for(const k of ['CARGO_HOME','RUSTUP_HOME','NATIVE_TOOL_BIN','NATIVE_CARGO','NATIVE_TAURI_ROOT','NATIVE_EDGE_DRIVER','NATIVE_DRIVER_TARGET'])assert.ok(path.resolve(process.env[k]).toLowerCase().startsWith(path.resolve(home).toLowerCase()+path.sep),'native 工具路径越界 '+k);
            assert.equal(await run('git',['--no-optional-locks','-C',root,'rev-parse','HEAD']),process.env.CANDIDATE_SHA);assert.equal(await run('git',['--no-optional-locks','-C',root,'status','--porcelain','--untracked-files=no']),'');
