              const webBefore=read(path.join(webRoot,'host-before.json')),webAfter=read(path.join(webRoot,'host-after.json'));assertHostUnchanged(webBefore,webAfter);const {parentEnvSha256:webCompatEnv,...webMachine}=webAfter;assertHostUnchanged(machineBefore,webMachine);
