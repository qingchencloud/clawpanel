            assert.equal(installCommand?.code,0,'实际Cargo安装未成功');assert.equal(metadata.version.checksum,'2f2e29bd6900fb718dfdc06f2e7a371d6087c085daaf83709847ef3e6b0c1953');
            const driver=path.join(driverRoot,'bin/tauri-driver.exe'),trackingFile=path.join(driverRoot,'.crates2.json'),trackingRaw=fs.readFileSync(trackingFile,'utf8'),installed=helpers.parseTauriDriverInstallReceipt(trackingRaw);
            const privateFile=(file,base)=>{const relative=path.relative(base,file);assert.ok(relative&&relative!=='..'&&!relative.startsWith('..'+path.sep)&&!path.isAbsolute(relative));assert.ok(fs.lstatSync(file).isFile());assert.equal(fs.realpathSync.native(file).toLowerCase(),path.resolve(file).toLowerCase(),'driver evidence路径链接');return file};privateFile(driver,driverRoot);privateFile(trackingFile,driverRoot);
            const cache=path.join(cargoHome,'registry/cache'),archives=fs.readdirSync(cache).map(d=>path.join(cache,d,'tauri-driver-2.1.0.crate')).filter(f=>fs.existsSync(f));assert.equal(archives.length,1,'实际Cargo crate归档不明确');const crateArchive={path:privateFile(archives[0],cargoHome),sha256:hash(archives[0])};assert.equal(crateArchive.sha256,metadata.version.checksum);
            const sourcePins={'Cargo.toml':'b30161d77b195300c06d5b461907134e640f9c8ca84284d7de421bb5920fa3ed','src/cli.rs':'d08a622c036becf29cad6cbcae5974ae630005354370f7605582f68bf2709a7c','src/server.rs':'4670240b353c3430ecf5c5a6192e9107952ec5bd4eea97ee24bfb2564746fdfa'};
            const sources=path.join(cargoHome,'registry/src'),roots=fs.readdirSync(sources).map(d=>path.join(sources,d,'tauri-driver-2.1.0')).filter(f=>fs.existsSync(f));assert.equal(roots.length,1,'实际Cargo driver源码不明确');const sourceHashes={},sourceFiles={};for(const [relative,pin]of Object.entries(sourcePins)){const file=privateFile(path.join(roots[0],relative),cargoHome);assert.equal(hash(file),pin,'固定crate源码改变 '+relative);sourceHashes[relative]=hash(file);sourceFiles[relative]=file}
            const binaryBefore=hash(driver),help=await runCommand(driver,['--help']);helpers.validateTauriDriverHelp(help);assert.equal(hash(driver),binaryBefore,'driver help执行前后binary改变');
            return {path:driver,version:installed.version,packageId:installed.packageId,versionSource:'cargo-install-tracking',crateChecksum:metadata.version.checksum,crateArchive,sourceHashes,sourceFiles,sha256:binaryBefore,sha256AfterHelp:hash(driver),receipt:{path:trackingFile,rawJson:trackingRaw,sha256:hash(trackingFile)},help:{text:help,sha256:crypto.createHash('sha256').update(help).digest('hex')},installCommand};
