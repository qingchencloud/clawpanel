  status-tail-diagnostic:
    name: Windows status three-tail diagnostic (NEVER qualification)
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'qingchencloud/clawpanel' && inputs.status_tail_diagnostic
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: 原准入及原20s/15s/900s后仅观测尾函数，不启动原生资格
        id: status_tail
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          EXPECTED_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          node tooling/scripts/test-hermes-windows-qualification.mjs --execute --status-tail-diagnostic --root candidate --sha "$env:CANDIDATE_SHA" --version "$env:EXPECTED_VERSION" --variant "$env:VARIANT" --output "$env:RUNNER_TEMP/hermes-status-tail-new"
          exit $LASTEXITCODE
      - name: 仅公开脱敏副本，失败或缺材料仍非资格
        if: always()
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP/hermes-status-tail-new"
          if (Test-Path -LiteralPath $source) {
            node tooling/scripts/test-hermes-windows-qualification.mjs --publish-evidence $source --output "$env:RUNNER_TEMP/hermes-status-tail-public"
            exit $LASTEXITCODE
          }
          throw 'No diagnostic report; NOT QUALIFIED'
      - name: 明确标记诊断及原CLI判定，不充当发布门禁
        if: always()
        shell: pwsh
        run: |
          '### STATUS TAIL DIAGNOSTIC — NEVER QUALIFICATION' >> $env:GITHUB_STEP_SUMMARY
          $file = "$env:RUNNER_TEMP/hermes-status-tail-new/report.json"
          if (!(Test-Path -LiteralPath $file)) { throw 'Missing diagnostic report; NOT QUALIFIED' }
          $r = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if ($r.diagnostic.qualificationPass -ne $false -or $r.diagnostic.kind -ne 'status-tail') { throw 'Invalid diagnostic mode; NOT QUALIFIED' }
          "Status: $($r.status); original CLI: $($r.gatewayStatusReadback.status); source: $($r.candidateSha). Native/lifecycle qualification NOT EXECUTED." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-status-tail-${{ matrix.sha }}-never-qualification
          path: ${{ runner.temp }}/hermes-status-tail-public/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

  linux-long-ui:
    name: Linux ${{ matrix.variant }} — fresh11 + two warm Send8/210s UI rounds
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'qingchencloud/clawpanel' && inputs.platform != 'windows' && !inputs.startup_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CANDIDATE_SHA: ${{ matrix.sha }}
      EXPECTED_VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: 初始化本 job 的临时证据和浏览器路径
        id: runtime_paths
        run: |
          printf 'EVIDENCE=%s/hermes-qualification-%s\n' "$RUNNER_TEMP" "$VARIANT" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/hermes-browser-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: 原可信 Runtime.Dockerfile 与私有 host Chromium
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import os,pathlib,subprocess,hashlib,json
          root=pathlib.Path('candidate');sha=os.environ['CANDIDATE_SHA'];files={}
          for name in subprocess.check_output(['git','-C',str(root),'ls-tree','-r','--name-only',sha]).decode().splitlines():
            blob=subprocess.check_output(['git','-C',str(root),'show',sha+':'+name]);assert (root/name).is_file() and not (root/name).is_symlink() and (root/name).read_bytes()==blob,name
            files[name]=hashlib.sha256(blob).hexdigest()
          pathlib.Path(os.environ['EVIDENCE'],'source-sha256.json').write_text(json.dumps({'sha':sha,'files':files},indent=2))
          PY
          # 仅普通用户私有字体，不更新/安装系统包，不修改父进程fontconfig环境。
          python3 - <<'PY'
          import runpy,pathlib,os
          helpers=runpy.run_path('tooling/scripts/hermes-qualification-browser.py')
          helpers['prepare_private_fonts'](pathlib.Path(os.environ['EVIDENCE']),pathlib.Path(os.environ['RUNNER_TEMP'])/('hermes-font-private-'+os.environ['VARIANT']))
          PY
          docker build --file tooling/.github/maintenance/Runtime.Dockerfile --tag hermes-qualification-trusted tooling
          sha256sum tooling/.github/maintenance/Runtime.Dockerfile tooling/scripts/maintenance-runtime-smoke.mjs tooling/scripts/hermes-qualification-bootstrap.mjs tooling/scripts/hermes-qualification-browser.py tooling/scripts/hermes-qualification-provider.mjs > "$EVIDENCE/tooling-sha256.txt"
          python3 -m venv "$RUNNER_TEMP/hermes-browser-venv"
          "$RUNNER_TEMP/hermes-browser-venv/bin/pip" install 'playwright==1.58.0'
          "$RUNNER_TEMP/hermes-browser-venv/bin/python" -m playwright install chromium
      - name: 非 root fresh11 后原容器同 HOME 生产 Web（只发布 host loopback）
        run: |
          set -euo pipefail
          cid=$(docker run -d --init --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=512 --memory=4g \
            --label "clawpanel.hermes.qualification.run=$GITHUB_RUN_ID" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tooling,dst=/tooling,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/candidate" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --publish 127.0.0.1::1420 --env HOME=/tmp/hermes-bootstrap --env CI=1 --env MAINTENANCE_ISOLATED_RUNTIME=1 \
            --env "QUALIFICATION_CANDIDATE_SHA=$CANDIDATE_SHA" --env "QUALIFICATION_EXPECTED_VERSION=$EXPECTED_VERSION" \
            hermes-qualification-trusted bash -euo pipefail -c '
              test ! -w /tooling/scripts/maintenance-runtime-smoke.mjs
              test ! -w /tooling/scripts/hermes-qualification-bootstrap.mjs
              mkdir -p "$HOME"
              npm ci
              npm run build
              node /tooling/scripts/maintenance-runtime-smoke.mjs --root /candidate --engine hermes --output /tmp/runtime
              exec node /tooling/scripts/hermes-qualification-bootstrap.mjs --root /candidate --runtime-output /tmp/runtime --output /evidence/server --host 0.0.0.0 --port 1420
            ')
          printf '%s' "$cid" > "$EVIDENCE/container-id.txt"
          docker inspect "$cid" > "$EVIDENCE/container-before.json"
          port=$(docker port "$cid" 1420/tcp | sed -n 's/^127\.0\.0\.1://p')
          test -n "$port"
          printf '%s' "$port" > "$EVIDENCE/host-port.txt"
          ready=0
          for tick in $(seq 1 1800); do
            if test "$(docker inspect -f '{{.State.Running}}' "$cid")" != true; then docker logs "$cid"; exit 1; fi
            if test -f "$EVIDENCE/server/ready.json" && curl --fail --silent "http://127.0.0.1:$port/__api/health" > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker cp "$cid:/tmp/runtime" "$EVIDENCE/runtime"
          python3 - <<'PY'
          import os,json,pathlib
          b=pathlib.Path(os.environ['EVIDENCE']);r=json.loads((b/'runtime/report.json').read_text());assert r['status']=='passed' and len(r['cases'])==11 and all(c['status']=='passed' for c in r['cases']);assert r['versions']['hermes']==os.environ['EXPECTED_VERSION'];assert r['environment']['home']=='/tmp/runtime/home'
          PY
      - name: 两轮真实 host headless Chromium，不重新安装（每轮 Send8 + hold 210）
        run: |
          set -euo pipefail
          port=$(cat "$EVIDENCE/host-port.txt")
          for round in 1 2; do
            "$RUNNER_TEMP/hermes-browser-venv/bin/python" tooling/scripts/hermes-qualification-browser.py --base-url "http://127.0.0.1:$port" --output "$EVIDENCE/browser-round$round" --hold 210 --font-environment "$EVIDENCE"
          done
      - name: 生产 STOP/PID/端口与原始日志（失败也保留）
        if: always()
        run: |
          set -euo pipefail
          test -f "$EVIDENCE/container-id.txt"
          cid=$(cat "$EVIDENCE/container-id.txt")
          test "$(docker inspect -f '{{index .Config.Labels "clawpanel.hermes.qualification.run"}}' "$cid")" = "$GITHUB_RUN_ID"
          if test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true; then docker kill --signal=TERM "$cid"; fi
          if ! timeout 60 docker wait "$cid" > "$EVIDENCE/container-exit.txt"; then
            docker inspect "$cid" > "$EVIDENCE/container-stop-timeout.json"
            docker logs --timestamps "$cid" > "$EVIDENCE/container.log" 2>&1
            docker cp "$cid:/tmp/runtime" "$EVIDENCE/runtime-at-timeout" || true
            exit 1
          fi
          docker inspect "$cid" > "$EVIDENCE/container-after.json"
          docker logs --timestamps "$cid" > "$EVIDENCE/container.log" 2>&1
          docker cp "$cid:/tmp/runtime" "$EVIDENCE/runtime-final"
          test "$(cat "$EVIDENCE/container-exit.txt")" = 0
          port=$(cat "$EVIDENCE/host-port.txt")
          HOST_PORT="$port" python3 - <<'PY'
          import os,socket
          s=socket.socket();s.settimeout(2)
          try:assert s.connect_ex(('127.0.0.1',int(os.environ['HOST_PORT'])))!=0,'published TCP port still open'
          finally:s.close()
          PY
          printf 'closed\n' > "$EVIDENCE/host-port-after.txt"
          node tooling/scripts/test-hermes-windows-qualification.mjs --verify-linux-evidence "$EVIDENCE" --sha "$CANDIDATE_SHA" --version "$EXPECTED_VERSION" > "$EVIDENCE/qualification-result.json"
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          b=pathlib.Path(os.environ['EVIDENCE']);r=json.loads((b/'source-sha256.json').read_text());root=pathlib.Path('candidate')
          for name,h in r['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,name
          PY
      - name: 仅生成脱敏公开证据（排除所有 runtime HOME/temp/cache）
        if: always()
        run: |
          node tooling/scripts/test-hermes-windows-qualification.mjs --publish-evidence "$EVIDENCE" --output "$RUNNER_TEMP/hermes-public-$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-linux-long-ui-${{ matrix.variant }}-${{ matrix.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/hermes-public-${{ matrix.variant }}/
      - name: 仅删除本 job 已核验 label 的容器（先留证据）
        if: always()
        run: |
          if test -f "$EVIDENCE/container-id.txt"; then
            cid=$(cat "$EVIDENCE/container-id.txt")
            test "$(docker inspect -f '{{index .Config.Labels "clawpanel.hermes.qualification.run"}}' "$cid")" = "$GITHUB_RUN_ID"
            docker rm -f "$cid"
          fi
