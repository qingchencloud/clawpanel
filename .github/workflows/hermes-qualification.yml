            // 官方 msedgedriver-tool 同一 WebView2 GUID/注册表顺序；无 latest 或不同版本 fallback。
            const runtime=JSON.parse(await ps(String.raw`$ErrorActionPreference='Stop';$guid='{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}';$keys=@('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\','HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\','HKCU:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\','HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\');$facts=@();foreach($k in $keys){$v=Get-ItemProperty -LiteralPath ($k+$guid) -ErrorAction SilentlyContinue;if($v.pv){$facts+=@{key=($k+$guid);version=$v.pv}}};$roots=@(([Environment]::GetFolderPath('ProgramFilesX86')+'\Microsoft\EdgeWebView\Application'),([Environment]::GetFolderPath('ProgramFiles')+'\Microsoft\EdgeWebView\Application'),('${proof.actualProfile}\AppData\Local\Microsoft\EdgeWebView\Application'));foreach($f in $facts){if($f.version -notmatch '^\d+\.\d+\.\d+\.\d+$'){continue};foreach($base in $roots){$exe=Join-Path (Join-Path $base $f.version) 'msedgewebview2.exe';if(Test-Path -LiteralPath $exe){$info=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe);@{version=$f.version;binaryVersion=$info.ProductVersion;path=$exe;registry=$facts}|ConvertTo-Json -Depth 6;exit 0}}};throw 'No matching installed WebView2 executable'`));
            assert.match(runtime.version,/^\d+\.\d+\.\d+\.\d+$/);assert.equal(runtime.binaryVersion.match(/^\d+\.\d+\.\d+\.\d+/)?.[0],runtime.version);write('installed-webview2.json',runtime);
            const url=`https://msedgedriver.microsoft.com/${runtime.version}/edgedriver_win64.zip`,download=await fetch(url,{signal:AbortSignal.timeout(300000)});assert.equal(download.status,200);const chunks=[];let bytes=0;for await(const b of download.body){bytes+=b.length;assert.ok(bytes<=100*1024*1024);chunks.push(b)}
